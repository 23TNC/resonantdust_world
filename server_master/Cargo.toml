[package]
name = "server_master"
version = "0.1.0"
edition = "2021"

# server_master — the simulation metronome. An SDK client that, every 1/TIC_HZ,
# advances `master_tic` on every shard by calling the `bump` reducer. It owns no
# state logic; it only drives the clock forward (bump then work-generates + the
# workers resolve). One shard for Phase A; the shard set grows later.
# See docs/simulation.md / docs/simulation-plan.md.

[[bin]]
name = "server_master"
path = "src/main.rs"

[dependencies]
# Pinned to the daemon/CLI (2.3.0), exactly as the edge `server` crate is — the
# generated bindings in src/bindings/ were emitted by this version.
spacetimedb-sdk = "=2.3.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
