# ── players.toml — the player-pawn's gameplay surface (player-pawns P3) ─────────────────
#
# Player-pawns are ROW-CARRIERS (never rendered, never moved — VARIABLES.md §Player-pawns):
# the `player` def below is what the login funnel mints every player's player-pawn with, and
# it derives their rows exactly as pawn kinds derive theirs. npc-host refines this into
# per-brain defs; this is the ONE default until then.

# The group-state need (F8 shape, the npc-host `wolf_count` drill lane): counts the LIVE
# pawns a brain-player owns. deplete 0 — only explicit writes (mint/death bookkeeping) move
# it. Encoding domain 0..16, matching the inventory need's small-count posture.
[[need]]
name = "wolf_count"
label = "Wolves"
min = 0
max = 16
deplete = 0.0
band = [
  { condition = "packless", lo = 0, hi = 1 },
]

# The banded "ran out of pawns" state (I8: it BANDS — it never kills; player defs author no
# death interaction, so the sweep's can_die gate stays shut by construction). The emotion
# modifiers are the drill's observable: a packless brain FEELS it (emotions argmax).
[[condition]]
name = "packless"
label = "Packless"
priority = 40
emotions = [
  { emotion = "scared", magnitude = 4 },
  { emotion = "uncomfortable", magnitude = 2 },
]

# The bunny twin of wolf_count (npc-host P1) — same shape, same band condition.
[[need]]
name = "bunny_count"
label = "Bunnies"
min = 0
max = 16
deplete = 0.0
band = [
  { condition = "packless", lo = 0, hi = 1 },
]

# The brain-parameter STATS (npc-host F10: parameters ride the STAT lane — the player
# traits' per-level `stats` contributions feed these through the ONE stat eval).
[[stat]]
name = "group_size"
label = "Group Size"
min = 0
max = 32

[[stat]]
name = "area_radius"
label = "Area of Influence"
min = 0
max = 64

# The PLAYER traits (F4/F7): per-level parameters as stat contributions. A brain def binds
# a level CONSTANT; the host reads group_size/area_radius through stat_value with the
# brain's player-trait rows.
[[player_trait_constant]]
name = "wolf_pack"
label = "Wolf pack"
stats = [ { stat = "group_size", add = [2, 4] } ]

[[player_trait_constant]]
name = "bunny_fluffle"
label = "Bunny fluffle"
stats = [ { stat = "group_size", add = [3, 6] } ]

[[player_trait_constant]]
name = "area_of_influence"
label = "Area of influence"
stats = [ { stat = "area_radius", add = [8, 12, 16] } ]

# The default player-pawn THING def lives at the END of things.toml (append-only seed order).

# ── sprint (trait-rows-u32 F3/F4) — THE canonical ACTIVE trait ─────────────────────────
#
# Activation grants BOTH conditions the same tic: `sprinting` (short — its stat modifier
# LOWERS ground_speed's tics/tile = faster hops) and `sprint_cooldown` (long — covering
# sprint + recovery: its PRESENCE is the re-activation gate via `blocked_by`, and its own
# modifier carries the exhaustion, slower hops while recovering). Two overlapping timers
# express the whole lifecycle; there is no expiry-chaining machinery.

[[condition]]
name = "sprinting"
label = "Sprinting"
duration = 60
priority = 45
stats = [ { stat = "ground_speed", add = -6.0, min = 4.0 } ]
emotions = [ { emotion = "motivated", magnitude = 3 } ]

[[condition]]
name = "sprint_cooldown"
label = "Winded"
duration = 300
priority = 35
stats = [ { stat = "ground_speed", add = 4.0 } ]
emotions = [ { emotion = "uncomfortable", magnitude = 2 } ]

[[pawn_trait_active]]
name = "sprint"
label = "Sprint"
activate = [
  { condition = "sprinting", duration = 60 },
  { condition = "sprint_cooldown", duration = 300 },
]
blocked_by = ["sprint_cooldown"]

# The player-lane twin (I8's drill vehicle): a brain rallies — pure condition/emotion
# state on the player-pawn, re-activation gated by its own presence.

[[condition]]
name = "rallied"
label = "Rallied"
duration = 120
priority = 30
emotions = [ { emotion = "focused", magnitude = 3 } ]

[[player_trait_active]]
name = "rally"
label = "Rally"
activate = [ { condition = "rallied", duration = 120 } ]
blocked_by = ["rallied"]
