# Emotions — the SIXTEEN feelings a pawn can hold (work 2026-08-07-emotions;
# schema docs/VARIABLES.md § Pawn gameplay state).
#
# DECLARATION ORDER IS LAW (emotions F1): the u4 index here is the emotion's whole
# identity — `fine` MUST be first (index 0 = the "alters nothing" default, the empty-
# argmax winner, the +0 gray). Sixteen max, never registry-numbered: emotions never
# cross the wire; every consumer evaluates from this corpus.
#
# The active emotion is the ARGMAX of the summed `emotions` modifiers on the pawn's
# traits + active conditions (ties → lowest index). `color` (required) paints the
# condition card's pie slice and the details panel's wash.
#
# User-fixed hues: sad blue, angry red, embarrassed yellow, fine gray (F8). The rest
# are authored distinct-hue and dark-theme-legible — one line each to retune.

[[emotion]]
name = "fine"
label = "Fine"
color = "#9aa4b0"

