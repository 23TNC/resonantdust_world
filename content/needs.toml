# Needs & conditions — the pawn's hidden state and its DISPLAYED consequences
# (work 2026-08-04-conditions + 2026-08-06-interactions + 2026-08-06-stat-model;
# schema docs/VARIABLES.md § Pawn gameplay state).
#
# A need is a SATISFACTION on its OWN authored domain (`min`..`max`; min may be
# negative, that IS the sign treatment) depleting toward `min` (`deplete` = TICS
# max→min at BASE rate). Stored as u16 FIXED-POINT on exactly these bounds in the
# `needs` sub-table `(value:16|kind:12|variant:4, set_tic)` — nothing ticks it: every
# observer computes the current value + the exact band crossings lazily, PIECEWISE
# across condition expiries. Bands are EXCLUSIVE ranges in the need's OWN units
# (lo <= sat < hi); the player sees CONDITIONS, never the scalar.
# `duration 0` = DERIVED (alive while its band holds); `> 0` = TIMED, a stored row
# holding remaining-at-write beside its written tic (drink's `quenched`).
#
# TIMED conditions (and trait levels) may MODIFY needs: `rate` multiplies depletion
# (multipliers form a product), min/max narrow the effective clamp. Every grant
# re-stamps the affected rows (the re-stamp law, stat-model F7); a DERIVED condition
# may not modify needs (F13 — its liveness is computed FROM them).
#
# NO ids (interactions F1): a gameplay def's identity is its derived taxonomy
# (`gameplay/need/thirst/default`), numbered by the registry; event inputs carry the
# full u32 definition_reference, stored rows its low 16 bits.
#
# Numbers are PROVISIONAL and authored here precisely so tuning is a data edit.
# 21600 tics = 1 h wall at 6 Hz. Thirst's domain is 0..100 — a percent scale, so the
# water tile's `drink 3` reads as +3% of full.

[[need]]
name = "thirst"
label = "Thirst"
min = 0
max = 100
deplete = 21600.0
band = [
  { condition = "thirsty", lo = 10, hi = 35 },
  { condition = "dehydrated", lo = 0, hi = 10 },
]

# `priority` sorts the details panel's cards, DESCENDING — the top 4 show maximized, the
# rest minimized. Authored, never derived from emotion magnitude: urgency is not
# intensity. Author in TENS so a new condition slots between two without renumbering.
#
# `emotions` (emotions F2): what the condition makes the pawn FEEL — feeds the
# active-emotion argmax and the card's pie slices. Magnitude 1..15; +0 = omit the line.

[[condition]]
name = "thirsty"
label = "Thirsty"
emotions = [ { emotion = "uncomfortable", magnitude = 2 } ]
priority = 20

[[condition]]
name = "dehydrated"
label = "Dehydrated"
emotions = [
  { emotion = "scared", magnitude = 5 },
  { emotion = "uncomfortable", magnitude = 3 },
]
priority = 30

[[condition]]
name = "quenched"
label = "Quenched"
emotions = [ { emotion = "happy", magnitude = 2 } ]
duration = 3600.0
priority = 10
# The stream's living proof of the modifier machinery (stat-model I4): while quenched,
# thirst depletes at HALF rate, and the eval integrates piecewise across the expiry.
needs = [ { need = "thirst", rate = 0.5 } ]

# HUNGER (food-chain, I8 — numbers provisional): thirst-shaped, slower (2 h wall at
# 6 Hz). eat_plant_matter / eat_meat satisfy it by the carrier's magnitude.
[[need]]
name = "hunger"
label = "Hunger"
min = 0
max = 100
deplete = 43200.0
band = [
  { condition = "hungry",   lo = 10, hi = 35 },
  { condition = "starving", lo = 0,  hi = 10 },
]

[[condition]]
name = "hungry"
label = "Hungry"
emotions = [ { emotion = "uncomfortable", magnitude = 2 } ]
priority = 20

[[condition]]
name = "starving"
label = "Starving"
emotions = [
  { emotion = "scared", magnitude = 4 },
  { emotion = "uncomfortable", magnitude = 3 },
]
priority = 30

# CORPUS — health (food-chain F2). The 0..2 domain is the ENCODING (the largest
# reachable cap); the EFFECTIVE cap is the leveled `corpus` trait's per-level max
# (level 1 → 1, level 2 → 2; the mint reads it). No deplete, no bands: health only
# moves by events, and DEATH fires from the need-write trigger (can_die, corpus ≤ 0).
[[need]]
name = "corpus"
label = "Corpus"
min = 0
max = 2

# INVENTORY — FREE SLOTS (inventory F1, the user's inversion: "at 0 we have 0 free
# slots"). The 0..16 domain is the ENCODING headroom; the EFFECTIVE cap is the leveled
# `inventory` trait's per-level max (level 1 → 6 — humans; future backpack tiers
# append). Mint-at-effective-max = ALL slots free at birth. No deplete, no bands:
# pick_up decrements (uses a slot), drop increments; the held ITEMS are rows in the
# pawn shard's inventory sub-table — rows = FILLED, this need = FREE, never conflate.
[[need]]
name = "inventory"
label = "Inventory"
min = 0
max = 16
