# Starting trait bindings (stat-model F11), minted as payload rows at CREATE: a bare
# string = level 1. walks level 2 = 12 tics/tile into ground_speed — the wolf's pace
# (the `speed` field is GONE, input-rework F8: the derived stat IS the speed).
