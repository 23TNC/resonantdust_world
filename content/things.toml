name = "human_female"
type = "pawn"
kind = "female"
subType = ["human"]
variant = ["0"]
# input-rework F8: pace = derived ground_speed. Level 1 = 24 tics/tile (the old
# `speed = 16` slot has no walks level; humans are the ambling debug fixture).
# human-pawns-redux F4: biological lifeforms THIRST — without the need, the pie menu
# offers Drink (metabolism passes) and the worker refuses (no row): the drift class.
# lumberjack F4: every human fells (dev posture, like walks); wolves refuse by the gate.
