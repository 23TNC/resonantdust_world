[[thing]]
name = "wolf"
type = "pawn"
kind = "wolf"
subType = ["animal"]
variant = ["0"]
needs = ["thirst", "hunger", "corpus"]
# Starting trait bindings (stat-model F11), minted as payload rows at CREATE: a bare
# string = level 1. walks level 2 = 12 tics/tile into ground_speed — the wolf's pace
# (the `speed` field is GONE, input-rework F8: the derived stat IS the speed).
# food-chain: corpus level 2 = the tanky tier (health cap 2); carnivore eats meat.
# attack F1: bite = the "attack" capability tag — wolves pass can_attack.
traits = ["biological_lifeform", { name = "walks", level = 2 }, { name = "corpus", level = 2 }, "carnivore", "bite"]
# The pawn's OWN kind carries death (food-chain F5/I9) — the need-write trigger fires it.
interactions = [ { name = "death" } ]

  [[thing.part]]
  tint = "#ffffff"
  geo = "#6a6a6a"
  anchor = { x = 0.5, y = 1.0 }
  sprite_anchor = { x = 0.5, y = 1.0 }
  size = 1.125
  sprite_scale = { w = 1.125, h = 1.125 }

  [thing.part.subframe]
  "s" = { x = 0.2969, y = 0.0469, w = 0.3906, h = 0.8594 }
  "e" = { x = 0.0, y = 0.2578, w = 1.0, h = 0.4688 }
  "n" = { x = 0.3359, y = 0.0859, w = 0.3281, h = 0.8438 }

