[[thing]]
name = "human_female"
type = "pawn"
kind = "female"
subType = ["human"]
variant = ["0"]
# input-rework F8: pace = derived ground_speed. Level 1 = 24 tics/tile (the old
# `speed = 16` slot has no walks level; humans are the ambling debug fixture).
# human-pawns-redux F4: biological lifeforms THIRST — without the need, the pie menu
# offers Drink (metabolism passes) and the worker refuses (no row): the drift class.
# lumberjack F4: every human fells (dev posture, like walks); wolves refuse by the gate.
# food-chain: humans hunger + carry health (corpus 1), forage, and eat BOTH (omnivore).
# inventory F1: the leveled inventory trait caps the FREE-SLOTS need at 6; the mint
# births all slots free. drop rides the pawn's OWN kind (the slot pie menu offers it).
needs = ["thirst", "hunger", "corpus", "inventory"]
traits = ["biological_lifeform", { name = "walks", level = 1 }, { name = "lumberjack", level = 1 }, { name = "corpus", level = 1 }, { name = "inventory", level = 1 }, "forager", "omnivore"]
interactions = [ { name = "death" }, { name = "drop" } ]

