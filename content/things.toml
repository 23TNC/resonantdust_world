# by every consumer, never stored, bakes into cold. Level 1 = the warm tuple.
traits = [ { name = "emit_light", level = 1, constant = true } ]
# Portable (inventory F6) — picking a torch up takes its LIGHT out of the world
# through the same tombstone lane; a nice stress of the render path.
interactions = [ { name = "pick_up" } ]

