# ── brains.toml — npc modules as content (npc-host F5/F10, VARIABLES.md §Brains) ────────
#
# A [[brain]] def is an npc module's CONSTANTS: the needs its player-pawn carries and the
# CONSTANT player-trait binds whose levels select its parameters (group_size / area_radius
# ride the STAT lane — the traits' per-level `stats` contributions). A brain is never a
# world object. THE LOGIN-NAME LAW: the mint funnel resolves a player-pawn's def by the
# logging-in player's NAME — the host logs each module-player in AS its brain def's name.

[[brain]]
name = "wolf_pack"
type = "brain"
kind = "wolf_pack"
subType = ["npc"]
variant = ["0"]
needs = ["wolf_count"]
traits = [
  { name = "wolf_pack" },
  { name = "area_of_influence", variant = 1 },
  { name = "rally" },
]

[[brain]]
name = "bunny_fluffle"
type = "brain"
kind = "bunny_fluffle"
subType = ["npc"]
variant = ["0"]
needs = ["bunny_count"]
traits = [
  { name = "bunny_fluffle" },
  { name = "area_of_influence" },
]
