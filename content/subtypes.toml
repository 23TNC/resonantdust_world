# Subtypes — `(type, name) → subtype_id`, for subtype axes with no record of their own.
#
# A biome authors its own `subtype` in biomes.toml, because a biome IS a record. A pawn SPECIES is
# not — it exists only as a segment of other defs' taxonomies — so its number lives here
# (definition-registry F16).
#
# These ids are STORED DATA: every packed pawn def carries its species in `subtype_id`. Never
# renumber; append with a fresh id. They were a code-owned palette in shared/codec until the
# registry could guarantee append-only numbering, which is exactly what it now does.

[[subtype]]
type = "pawn"
name = "animal"
id = 1

[[subtype]]
type = "pawn"
name = "human"
id = 2

[[subtype]]
type = "pawn"
name = "player"
id = 3

[[subtype]]
type = "brain"
name = "npc"
id = 1
