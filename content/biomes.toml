# Biomes — the per-tile classifier as DATA (toml-content F3).
#
# Worldgen samples 3 noise DIMENSIONS at each cell — temperature, humidity,
# elevation, all in [0,1] (below ~0.35 elevation is under water) — then walks
# this ARRAY IN ORDER and takes the FIRST biome whose `when` passes (every
# listed dimension must pass; the corpus never needed `or`). Order = priority:
# elevation bands first, then climate biomes, then the plains catch-all
# (no `when` = always true) LAST.
#
# `subtype` is the biome's STABLE identity in stored zones (never renumber —
# append a new biome with the next free id; REORDER freely for priority).
#
# `scatter` draws are ordered least→most dominant; the LAST passing draw wins
# the cell. Each rolls `tile_rand(tile_seed, salt) < p` — a distinct salt per
# feature keeps draws independent. NO torch scatter, deliberately: torches are
# seeded objects (docs/work/2026-07-26-torch-thing), not flora.

[[biome]]
name = "ocean"
subtype = 1
when = { elevation = { lt = 0.32 } }
tile = "water"

[[biome]]
name = "beach"
subtype = 2
when = { elevation = { lt = 0.38 } }
tile = "sand"
scatter = [ { salt = 1, p = 0.03, thing = "rock" } ]

[[biome]]
name = "mountains"
subtype = 3
when = { elevation = { gte = 0.82 } }
tile = "stone"
scatter = [ { salt = 2, p = 0.08, thing = "rock" } ]

[[biome]]
name = "wetland"
subtype = 4
when = { humidity = { gte = 0.60 }, elevation = { lt = 0.46 } }
tile = "dirt"
scatter = [ { salt = 3, p = 0.25, thing = "reed" } ]

[[biome]]
name = "desert"
subtype = 5
when = { temperature = { gte = 0.68 }, humidity = { lt = 0.32 } }
tile = "sand"
scatter = [ { salt = 4, p = 0.04, thing = "cactus" } ]

[[biome]]
name = "forest"
subtype = 6
when = { humidity = { gte = 0.55 }, temperature = { gte = 0.35, lte = 0.80 } }
tile = "grass"
scatter = [
  { salt = 8, p = 0.16, thing = "flora" },
  { salt = 5, p = 0.14, thing = "shrub" },
  { salt = 6, p = 0.22, thing = "tree" },
]

[[biome]]
name = "plains"
subtype = 7
tile = "grass"
scatter = [
  { salt = 9, p = 0.20, thing = "flora" },
  { salt = 7, p = 0.06, thing = "shrub" },
]
