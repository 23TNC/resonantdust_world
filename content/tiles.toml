# Tiles — see docs/VARIABLES.md § TOML content schema.
# NO ids: the corpus DESCRIBES (type/kind/subType/variant) and the server NUMBERS, into
# `index.definitions` (definition-registry F1). A def's number survives a reorder because the
# registry keeps it, which is what the old `id = N` law was reaching for.

