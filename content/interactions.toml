# Stats, traits, interactions, affordances — what a pawn IS, what it can DO, and who
# may do it (work 2026-08-06-stat-model; schema docs/VARIABLES.md § TOML content schema).
#
# The four-family model (user, 2026-08-06):
#   - a STAT is a DERIVED quantity — never stored, never fanned: computed anywhere from
#     the pawn's trait/condition rows + this corpus. It authors GLOBAL safety bounds and
#     the empty-intersection `winner` ("min"/"max") for the range combiner (F6);
#   - a TRAIT is a LEVELED stat contributor ("traits/skills"): each modifier field is a
#     per-LEVEL array (index = level − 1). Thing defs bind starting `(trait, level)`
#     pairs, minted at CREATE;
#   - an INTERACTION is something a pawn can do — how (inputs, location) and what it
#     does (effects), GATED by `affordances` (every listed predicate must pass).
#     Carriers author `interactions = [{ name, magnitude }]` — the water tile offers
#     `drink 3`, a future waterskin 1 or 5;
#   - an AFFORDANCE is a named PREDICATE over pawn stats: `check = { stat, above|below }`
#     (exactly one; both thresholds EXCLUSIVE). `can_move_air`/`can_teleport` are a
#     stat + an affordance away — no new code.
#
# NO ids (interactions F1/F9): identity is the derived taxonomy
# (`gameplay/interaction/drink/default`), numbered by the registry.
#
# Effect operands: `"@name"` binds an input slot; a bare name or number is baked.
# `amount` is a SIGNED f32 in the need's own units, clamped to its effective domain and
# quantized ONCE at write (stat-model F4) — damage-a-need is the same mechanism.

# ── stats ─────────────────────────────────────────────────────────────────────

# Ground locomotion pace in TICS PER TILE (lower = faster; 0 = cannot ground-move).
# The wolf's walks level 2 contributes 12 — equal to its `speed` field until the
# input stream rewires movement onto this stat (stat-model F12/I10).
[[stat]]
name = "ground_speed"
label = "Ground Speed"
min = 0
max = 240
winner = "min"

# The "is a metabolizing organism" scalar can_drink reads. biological_lifeform
# contributes 1; a golem contributes nothing and cannot drink.
[[stat]]
name = "metabolism"
label = "Metabolism"
min = 0
max = 10
winner = "min"

# Tree-felling capability (lumberjack F7): can_fell_trees reads it; the lumberjack
# trait contributes 1. Levels are room for skill later — the gate only asks > 0.
[[stat]]
name = "logging"
label = "Logging"
min = 0
max = 10
winner = "min"

# ── the diet/ability gates (food-chain F3) — traits contribute, affordances ask > 0;
# "has Herbivore OR Omnivore" is the SUM being positive. ──

[[stat]]
name = "foraging"
label = "Foraging"
min = 0
max = 10
winner = "min"

[[stat]]
name = "plant_eating"
label = "Plant Eating"
min = 0
max = 10
winner = "min"

[[stat]]
name = "meat_eating"
label = "Meat Eating"
min = 0
max = 10
winner = "min"

# ── traits ────────────────────────────────────────────────────────────────────

[[trait]]
name = "biological_lifeform"
label = "Biological Lifeform"
stats = [ { stat = "metabolism", add = [1] } ]

# The leveled locomotion skill (stat-model F5): level 1 lumbers, level 2 is the wolf's
# standard pace, level 3 sprints. Values are tics/tile INTO ground_speed.
[[trait]]
name = "walks"
label = "Walks"
stats = [ { stat = "ground_speed", add = [24, 12, 6] } ]

# The tree-feller (lumberjack F4/F7): level 1 is all the gate needs today.
[[trait]]
name = "lumberjack"
label = "Lumberjack"
stats = [ { stat = "logging", add = [1] } ]

# The HEALTH cap (food-chain F2, the user's shape): ONE leveled trait owns corpus's
# effective max — level 1 = ordinary life (cap 1), level 2 = the wolves' tier (cap 2).
# Need MAX modifiers tier UPWARD (highest wins); the mint reads the effective cap.
[[trait]]
name = "corpus"
label = "Corpus"
needs = [ { need = "corpus", max = [1.0, 2.0] } ]

# ORDER IS LAW (attack I1, learned the hard way): gameplay defs are numbered by
# POSITION at seed, and the registry keeps the id a tuple was FIRST recorded with —
# so new defs APPEND at the END of their category, never mid-list. A mid-list insert
# shifts every later def's seed id off its registry row: the mint writes rows one
# name, registry consumers read another (an omnivore that reads as bite), and the
# collided newcomer silently never seeds. The trait order below is the registry's
# recorded history; append after `inventory`.
[[trait]]
name = "forager"
label = "Forager"
stats = [ { stat = "foraging", add = [1] } ]

[[trait]]
name = "herbivore"
label = "Herbivore"
stats = [ { stat = "plant_eating", add = [1] } ]

[[trait]]
name = "carnivore"
label = "Carnivore"
stats = [ { stat = "meat_eating", add = [1] } ]

[[trait]]
name = "omnivore"
label = "Omnivore"
stats = [ { stat = "plant_eating", add = [1] }, { stat = "meat_eating", add = [1] } ]

# The BITE (attack F1, the user's generalization): a capability TAG, not a stat —
# can_attack matches ANY trait tagged "attack", so a clawed bear or a pecking hawk
# joins the predator club by content alone. Tag-only: presence IS the capability.
[[trait]]
name = "bite"
label = "Bite"
tags = ["attack"]

# The CARRYING capacity (inventory F1, the user's shape): ONE leveled trait provides
# the inventory need and caps it — the need counts FREE slots, so the standing
# mint-at-effective-max law births every carrier with all slots free. Level 1 = 6
# (humans); future backpack tiers append per-level values.
[[trait]]
name = "inventory"
label = "Inventory"
needs = [ { need = "inventory", max = [6.0] } ]

# ── interactions ──────────────────────────────────────────────────────────────

# Input names are the RESERVED pie-menu vocabulary (input-rework F5): `pawn` = the
# active selection, `destination` = the clicked tile, `amount` = the carrier binding's
# magnitude. drink's need is BAKED — a generic menu cannot guess a need input.
[[interaction]]
name = "drink"
label = "Drink"
menu_text = "Drink"
affordances = ["can_drink"]
# `destination` (lumberjack P3) names the clicked carrier so a FAR order can compose
# [walk, drink] through the intent queue; no effect consumes it — the location rule does.
inputs = ["pawn", "destination", "amount"]
satisfy = { target = "@pawn", need = "thirst", amount = "@amount" }
grant = ["quenched"]
# Placement (lumberjack F2): on-or-beside the carrier — Chebyshev ≤ 1 INCLUSIVE. A far
# order composes a walk first via the intent queue (ACTIONS.md § The intent queue).
location = "adjacent"
duration = 0
# The queue-strip circle (intent-queue-ui): fill, green, cw; cancelable while executing.
queue = { hover = "Drinking", background = "#2e5a78", progress = "cw", progress_color = "#3ad64f", progress_fill = true, cancelable = true }

# Movement as an interaction (input-rework F2/F6): the worker validates (the DESTINATION
# tile offers this — location "target") and queues the movement-chain seed; chain spacing
# derives from the pawn's ground_speed stat. MOVE_TO itself is worker-only now (F3).
[[interaction]]
name = "move_to"
label = "Move To"
menu_text = "Move To"
affordances = ["can_move_ground"]
inputs = ["pawn", "destination"]
move = { target = "@pawn", to = "@destination" }
location = "target"
duration = 0
# Smaller + ringless in the queue strip (intent-queue-ui): walks are plumbing, not work.
queue = { hover = "Moving", size = 0.6, progress = "none" }

# Timed work on the world (lumberjack F5/F7): fell the carrier thing. `destination` is
# the tree's tile; adjacency gates the swing; the COMPLETION at +duration re-validates
# and clears the carrier's cell (`destroy = "carrier"` → cold-overlay SET kind 0). The
# `yields = "logs"` successor (lumberjack I9) lands beside `destroy`, not built yet.
[[interaction]]
name = "cut_down"
label = "Cut Down"
menu_text = "Cut Down"
affordances = ["can_fell_trees"]
inputs = ["pawn", "destination"]
destroy = "carrier"
location = "adjacent"
duration = 30
queue = { hover = "Cutting down", background = "#4a6a3a", progress = "cw", progress_color = "#3ad64f", progress_fill = true, cancelable = true }

# DEATH (food-chain F5, the user's law): fired by the NEED-WRITE TRIGGER when a
# corpus write leaves the holder at ≤ 0 — the worker sweeps, validates can_die, and
# queues this through the same event door everything rides. The pawn's OWN kind
# carries it (location `self` — the one hot-carrier rule, I9). Effects: MEAT into the
# holder's floor cell (the yield lane), then the pawn shard's `remove` (StateGone
# fans; clients drop the mover; idempotent).
[[interaction]]
name = "death"
label = "Death"
menu_text = "Death"
affordances = ["can_die"]
inputs = ["pawn"]
location = "self"
spawn = { thing = "meat", at = "on" }
remove = "target"
duration = 0
queue = { hover = "Dying", size = 0.8 }

# FORAGE (food-chain F6): timed work on FLORA — the flora SURVIVES; plant matter
# lands on the first EMPTY pathable cell of the carrier's 3×3 (fixed scan; all
# full = a logged no-yield). Sub-tile near-the-flora placement is the recorded
# successor.
[[interaction]]
name = "forage"
label = "Forage"
menu_text = "Forage"
affordances = ["can_forage"]
inputs = ["pawn", "destination"]
location = "adjacent"
spawn = { thing = "plant_matter", at = "adjacent" }
duration = 30
queue = { hover = "Foraging", background = "#3a5a2a", progress = "cw", progress_color = "#58c04a", progress_fill = true, cancelable = true }

# The EATS (food-chain F7): consume the carrier (destroy, no yield) + satisfy hunger
# by the carrier binding's magnitude — the drink pattern, on things.
[[interaction]]
name = "eat_plant_matter"
label = "Eat Plant Matter"
menu_text = "Eat"
affordances = ["can_eat_plants"]
inputs = ["pawn", "destination", "amount"]
satisfy = { target = "@pawn", need = "hunger", amount = "@amount" }
destroy = "carrier"
location = "adjacent"
duration = 20
queue = { hover = "Eating", background = "#3a5a2a", progress = "cw", progress_color = "#58c04a", progress_fill = true, cancelable = true }

[[interaction]]
name = "eat_meat"
label = "Eat Meat"
menu_text = "Eat"
affordances = ["can_eat_meat"]
inputs = ["pawn", "destination", "amount"]
satisfy = { target = "@pawn", need = "hunger", amount = "@amount" }
destroy = "carrier"
location = "adjacent"
duration = 20
queue = { hover = "Eating", background = "#6a3a2a", progress = "cw", progress_color = "#d65a3a", progress_fill = true, cancelable = true }

# PICK UP (inventory F4): walk-then-act on a portable thing — the carrier leaves the
# world (the destroy tombstone lane) and its kind def lands in the acting pawn's
# first free inventory slot, with the free-count SET_NEED in the SAME program (F3).
# can_carry = the inventory need > 0 (has the need AND a free slot; absent row never
# passes). The completion re-validates carrier + free slot (a raced log: loser no-ops).
[[interaction]]
name = "pick_up"
label = "Pick Up"
menu_text = "Pick Up"
affordances = ["can_carry"]
inputs = ["pawn", "destination"]
location = "adjacent"
store = "carrier"
duration = 10
queue = { hover = "Picking up", background = "#5a5a3a", progress = "cw", progress_color = "#d6c23a", progress_fill = true, cancelable = true }

# DROP (inventory F5, the generic shape): ONE interaction on the inventory-bearing
# PAWN kinds — location "slot" makes the carrier an inventory slot of the ACTING pawn.
# `slot` + `item` (the def the clicker SAW there) ride the inputs, and the execution
# re-validates the slot still holds that item — a mismatch is a logged no-op (I5).
# spawn = "carried" places the SLOT's kind on the first EMPTY pathable adjacent cell —
# and REFUSES when none exists (the item stays held; never forage's
# all-full-swallows rule). Then INV_REMOVE + the free-count SET_NEED.
[[interaction]]
name = "drop"
label = "Drop"
menu_text = "Drop"
inputs = ["pawn", "slot", "item"]
location = "slot"
spawn = "carried"
duration = 0
queue = { hover = "Dropping", size = 0.8 }

# ATTACK (attack F2): carried by the PREY's kind — the bunny OFFERS being attacked,
# the way water offers drink — gated by can_attack (the tag check) on the ACTOR. The
# `target` input is the clicked PAWN's entity (the first hot carrier that is not
# `self`); satisfy targets @target with the binding's NEGATIVE magnitude, so the hit
# lands on the VICTIM's corpus and the need-write trigger carries the kill to death,
# meat, and the food chain from there. Walk-then-act composes the chase's first leg;
# the completion re-validates adjacency against the target's CURRENT position — prey
# that moved makes the swing a logged no-op (re-issue is the hunter's job).
[[interaction]]
name = "attack"
label = "Attack"
menu_text = "Attack"
affordances = ["can_attack"]
inputs = ["pawn", "target", "amount"]
satisfy = { target = "@target", need = "corpus", amount = "@amount" }
location = "adjacent"
duration = 10
queue = { hover = "Attacking", background = "#6a2a2a", progress = "cw", progress_color = "#d64a3a", progress_fill = true, cancelable = true }

# ── affordances ───────────────────────────────────────────────────────────────

[[affordance]]
name = "can_drink"
label = "Can Drink"
check = { stat = "metabolism", above = 0.0 }

# Authored ahead of the movement rewire (stat-model F12): the input stream's move_to
# interaction gates on this.
[[affordance]]
name = "can_move_ground"
label = "Can Move Ground"
check = { stat = "ground_speed", above = 0.0 }

[[affordance]]
name = "can_fell_trees"
label = "Can Fell Trees"
check = { stat = "logging", above = 0.0 }

[[affordance]]
name = "can_forage"
label = "Can Forage"
check = { stat = "foraging", above = 0.0 }

[[affordance]]
name = "can_eat_plants"
label = "Can Eat Plants"
check = { stat = "plant_eating", above = 0.0 }

[[affordance]]
name = "can_eat_meat"
label = "Can Eat Meat"
check = { stat = "meat_eating", above = 0.0 }

# The death gate (food-chain F4) — a NEED check, which is ALSO its need-write trigger
# key (F5): any worker corpus write sweeps the holder's interactions and fires death
# when this passes. The 4-tic barrier window is a feature: a heal inside it saves you.
[[affordance]]
name = "can_die"
label = "Can Die"
check = { need = "corpus", lte = 0.0 }

# The carry gate (inventory F1/F4): the need counts FREE slots, so `> 0` is both "has
# an inventory" (an absent row never passes) and "a slot is free" — no new machinery.
[[affordance]]
name = "can_carry"
label = "Can Carry"
check = { need = "inventory", gt = 0.0 }

# The attack gate (attack F1): a TAG check — any trait tagged "attack" passes.
[[affordance]]
name = "can_attack"
label = "Can Attack"
check = { tag = "attack" }
