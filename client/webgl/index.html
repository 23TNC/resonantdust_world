<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resonant Dust — world (webgl)</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #101418; }
      #app { width: 100%; height: 100%; }
      canvas { display: block; width: 100%; height: 100%; }

      /*
       * The UI scale. `--ui-row` is written by PanelGrid on every grid
       * rebuild (one property, once per resize); everything below is a
       * calc() off it, so the whole UI re-scales from that single write.
       * No component may hardcode a pixel font size or padding.
       *
       * The ratios are not invented — measured against the pre-grid
       * 32px taskbar, the chrome was already authored in EIGHTHS of a
       * row: 12px font = 3/8, 4px gap = 1/8, 8px pad = 2/8, 24px
       * entries = 6/8, 32px buttons = 8/8. This names that rhythm, which
       * is why a 1080-tall viewport lands back on exactly 12px.
       *
       * Design: docs/components/client/webgl/design/panel-layout.md
       */
      :root {
        /* Fallback only — PanelGrid overwrites this before first paint.
           33 rows of a 1080-tall viewport. */
        --ui-row: 32.7px;

        /* Base text: 3/8 of a row, floored at 9px. The floor is safe
           where a minimum CELL size would not be — glyphs don't take
           part in the grid arithmetic, so flooring text breaks no
           layout invariant. No upper clamp: a 4K viewport gets a 65px
           row and 24px text, which is the UI scaling correctly. */
        --ui-font:    max(9px, calc(var(--ui-row) * 0.375));

        /* The other steps are multiples of the FLOORED base, not of
           --ui-row. Deriving them from the row independently would let
           the ladder INVERT once the floor engages — at a 19px row an
           unfloored 0.4375 "large" is 8.3px, under the 9px base. Off
           the base they stay ordered at every size, and reproduce
           today's 11 / 13 / 14 / 16px exactly at a 32px row. */
        --ui-font-sm: calc(var(--ui-font) * 0.9167);
        --ui-font-md: calc(var(--ui-font) * 1.0833);
        --ui-font-lg: calc(var(--ui-font) * 1.1667);
        --ui-font-xl: calc(var(--ui-font) * 1.3333);

        --ui-pad:     calc(var(--ui-row) * 0.25);
        --ui-pad-sm:  calc(var(--ui-row) * 0.125);
        --ui-gap:     calc(var(--ui-row) * 0.125);
        --ui-btn:     calc(var(--ui-row) * 0.75);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
