networks:
  resonantdust:
    external: true

services:
  # Compile the headless client (library + `headless` binary) on the local
  # daemon. Output lands at /workspace/target/release/headless, visible on the
  # host via the bind mount. Stock `rust:slim` is enough: all current envs speak
  # plain ws:// / http://, so the client pulls in no TLS backend (no openssl /
  # pkg-config) — unlike the world `server`, which needs them for the SDK.
  build:
    image: rust:slim
    volumes:
      - .:/workspace
      # The client path-deps resonantdust-codec at ../shared/codec (the `zones`
      # manager folds tile-radii into zone ids with it). Mount the shared
      # workspace as a sibling of /workspace so that relative path resolves
      # in-container (/workspace/../shared/codec = /shared/codec) — same as the
      # world server's compose.
      - ../shared:/shared
    working_dir: /workspace
    command: ["cargo", "build", "--release"]

  # Type-check everything (lib + bin + tests) without producing a binary — the
  # quick inner-loop check. `docker compose -f client/compose.yml run --rm check`.
  check:
    image: rust:slim
    volumes:
      - .:/workspace
      # See `build`: resolves the ../shared/codec path dep in-container.
      - ../shared:/shared
    working_dir: /workspace
    command: ["cargo", "check", "--all-targets"]

  # Run the headless login driver against a gateway on the resonantdust network.
  # Pass the player name + env at invocation:
  #   docker compose -f client/compose.yml run --rm \
  #     -e RD_ENV=claude -e CLIENT_GATEWAY_URL=http://gateway-claude:9474 \
  #     headless Alice
  headless:
    image: rust:slim
    networks: [resonantdust]
    volumes:
      - .:/workspace
    working_dir: /workspace
    entrypoint: ["/workspace/target/release/headless"]
