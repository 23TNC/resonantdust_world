[package]
name = "client"
version = "0.1.0"
edition = "2021"

# The headless client is a LIBRARY first: `pixijs` (later, via a wasm/FFI shim)
# and other Rust programs link it and drive it through the command/event API in
# `lib.rs`. The `headless` binary is just one such host — a CLI driver that logs
# in and prints the events, useful on its own for smoke-testing the gateway +
# world-server round-trip.
[lib]
name = "client"
path = "src/lib.rs"

[[bin]]
name = "headless"
path = "src/bin/headless.rs"
# The CLI driver needs the native (tokio) runtime + transport.
required-features = ["native"]

[features]
# `native` is the only host today: a tokio runtime with reqwest (gateway HTTP)
# and tokio-tungstenite (world-server WS). A future `web` feature would supply a
# browser transport (fetch + WebSocket) for the pixijs wasm bundle, reusing the
# same `Command` / `Event` / `protocol` core — which is why the networking deps
# are optional and gated here rather than always-on.
default = ["native"]
native = [
    "dep:tokio",
    "dep:tokio-tungstenite",
    "dep:futures-util",
    "dep:reqwest",
    "dep:tracing-subscriber",
]
# `web` is the browser host: the same `Command` / `Event` / `protocol` / `zones`
# core driven by a wasm transport — `ws_stream_wasm` (world-server WS), `gloo-net`
# (gateway fetch), and `wasm-bindgen-futures::spawn_local` for the engine task.
# Pulled in by the `resonantdust-shared` wasm bundle (which wraps this for the
# browser); never built natively. `js-sys` supplies the wall clock (`Date::now`).
web = [
    "dep:wasm-bindgen-futures",
    "dep:js-sys",
    "dep:futures",
    "dep:ws_stream_wasm",
    "dep:gloo-net",
    "dep:gloo-timers",
]

[dependencies]
# Pure core — protocol framing and the command/event types — needs only serde.
# These are host-agnostic and compile on any target (native or wasm).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

# The shared bit-packing codec: the one definition of `zone_id` composition, used
# by the anchor-driven `zones` manager to fold tile-radii into zone ids. Pure
# integer math, host-agnostic (no wasm dependency). Host-relative path
# (client/core/ → repo/shared): this crate builds both standalone (client/compose)
# AND transitively inside the repo-root wasm build (shared/compose), so the path
# must resolve on the real tree — `../../shared/codec`, not a container sibling.
resonantdust-codec = { path = "../../shared/codec" }
# The SHARED simulation rules (shared-simulation P2) — the mover track asks
# `move_eval::position_at` where a walking pawn is; it computes no motion itself.
resonantdust-content = { path = "../../shared/content" }

# Native host transport, all gated behind the `native` feature. All current
# environments speak plain ws:// / http:// (see config.rs), so NO TLS backend is
# pulled in — reqwest drops its default TLS and tokio-tungstenite uses no tls
# feature. That keeps the build on stock `rust:slim` (no openssl/pkg-config),
# mirroring gateway/compose.yml. Add a TLS feature here when an env goes wss://.
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "sync",
    "time",
    "signal",
], optional = true }
tokio-tungstenite = { version = "0.21", optional = true }
futures-util = { version = "0.3", optional = true }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
], optional = true }
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
], optional = true }

# Web host transport, all gated behind the `web` feature (built only for the
# `wasm32-unknown-unknown` target inside the `resonantdust-shared` bundle). All
# environments speak plain ws:// / http://, so no TLS plumbing is needed here
# either. `futures` supplies the channels + `select!` the engine loop is built on.
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
futures = { version = "0.3", optional = true }
ws_stream_wasm = { version = "0.7", optional = true }
gloo-net = { version = "0.6", default-features = false, features = [
    "http",
], optional = true }
# The browser periodic timer behind the clock-sync ping cadence. `futures` gives
# the `IntervalStream` the engine's `select!` loop polls.
gloo-timers = { version = "0.3", default-features = false, features = [
    "futures",
], optional = true }
