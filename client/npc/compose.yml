networks:
  resonantdust:
    external: true

services:
  # Compile the NPC driver on the local daemon. Output lands at
  # /workspace/target/release/npc, visible on the host via the bind mount. Stock
  # `rust:slim` is enough (plain ws:// everywhere → no TLS backend), same as the
  # headless client core.
  #
  # The npc crate's path deps are REPO-relative (first-pawns F6) — the whole repo mounts at
  # /workspace with the workdir at client/npc, the same shape bin/sim uses, so one layout
  # serves both runners.
  build:
    image: rust:slim
    volumes:
      - ../..:/workspace
    working_dir: /workspace/client/npc
    command: ["cargo", "build", "--release"]

  # Type-check without producing a binary — the quick inner-loop check.
  check:
    image: rust:slim
    volumes:
      - ../..:/workspace
    working_dir: /workspace/client/npc
    command: ["cargo", "check", "--all-targets"]

  # Run the NPC driver against a gateway on the resonantdust network. Pass the
  # NPC-owner name + env at invocation. NOTE: the supervised runner is `bin/sim run npc`
  # (host network, container rd-npc — first-pawns F6); this service remains for one-off runs.
  # The gateway resolves the edge as ws://localhost:8473, so host networking is required:
  #   docker compose -f client/npc/compose.yml run --rm run wolves   # (compose net — legacy)
  #   bin/sim run npc NPC_BRAIN=wolves                               # (the supervised way)
  run:
    image: rust:slim
    network_mode: host
    volumes:
      - ../..:/workspace
    working_dir: /workspace/client/npc
    entrypoint: ["/workspace/client/npc/target/release/npc"]
