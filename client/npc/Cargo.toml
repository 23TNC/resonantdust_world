[package]
name = "npc"
version = "0.1.0"
edition = "2021"

# npc — the demo mover. A direct-SDK client to the object shard that seeds a handful
# of "demo objects" (type-tagged in their object_id) in zone (0,0) and, on a timer,
# moves each to a random cell via `append_event(ACTION_MOVE)`. The tick pipeline
# (master + server_simulation) resolves the moves into `state`; the edge streams
# `state` to browsers, which draw each demo object as a tweening circle. The point is
# to watch the SAME motion across browser tabs and catch sync issues — the whole reason
# for the 0.2 rework. (Supersedes the old login-through-client debug_mover driver;
# movement now flows through the real event/state pipeline, not a legacy streamer.)

[[bin]]
name = "npc"
path = "src/main.rs"

[dependencies]
spacetimedb-sdk = "=2.3.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Shared layouts: object-id type tag + entity key (codec) and the move data encoding
# (tick), so the mover, the worker, and the client all agree.
resonantdust-codec = { path = "../shared/codec" }
resonantdust-tick = { path = "../shared/tick" }
