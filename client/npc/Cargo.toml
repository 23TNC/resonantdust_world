[package]
name = "npc"
version = "0.1.0"
edition = "2021"

# npc — an automated player. It drives the headless `client` (client/core) exactly as the
# pixijs browser client does, so wildlife actions travel login → client → edge → spacetime
# with no privileged shortcut. This binary is the wildlife npc (a wolf pack in zone (0,0));
# the connect/anchor harness is written to extract into a shared `npc` lib once a second npc
# type (e.g. a village) exists. (Supersedes the old direct-to-shard demo mover — movement now
# goes through the real player command path, not `append_event` on a raw SDK connection.)

[lib]
name = "npc"
path = "src/lib.rs"

[[bin]]
name = "npc"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The headless client, linked natively and driven through its command/event API — the same
# core the webgl wasm bundle wraps. Paths are REPO-relative (first-pawns F6): builds mount the
# whole repo at /workspace (bin/sim and compose.yml alike), so ../core and ../../shared resolve
# the same everywhere.
client = { path = "../core" }
# Shared layout: reference packing + the action palette (codec).
resonantdust-codec = { path = "../../shared/codec" }
# The content authority (first-pawns F5): the npc resolves the wolf's def id from the SAME
# corpus the clients render with (fetched from the edge's `/content`), never a hardcoded
# constant — `KIND_WOLF`-style pinned numbers drift the moment content reorders.
resonantdust-dsl = { path = "../../shared/dsl" }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde_json = "1"
