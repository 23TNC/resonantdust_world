[package]
name = "resonantdust_pipeline"
version = "0.1.0"
edition = "2021"

# The simulation tick pipeline (event_log / state_log / state / tic_meta tables + the
# append_event / bump / claim / resolve / seed_entity / tick_gc reducers), shared by
# BOTH shard classes (object_shard, zone_shard) so they run one identical engine keyed
# by the unified entity_key. An rlib the module cdylibs link. See docs/simulation.md.
[lib]
crate-type = ["rlib"]

[dependencies]
spacetimedb = { version = "=2.1.0" }
# The shared entity-key / object-id bit layout — the pipeline mints globally-unique
# object_ids and builds entity keys with the same packing the edge/client use.
# Container path (built inside the module workspace): /workspace/shared/codec.
resonantdust-codec = { path = "../../shared/codec" }
