[package]
name = "worker"
version = "0.1.0"
edition = "2021"

# worker — a worker in the resolution pool. An SDK client that subscribes
# to a shard's event_log/state_log, claims pending (entity, tic) work, composes the
# tic's events onto the entity's prior resolved state (via resonantdust-tick), and
# commits the result through the fenced `resolve` reducer. Phase A2 handles
# position-only actions (move) with same-shard reads; the read-rule/priority-DAG and
# actor-reading actions (damage) land in A3. See docs/simulation-plan.md.

[[bin]]
name = "worker"
path = "src/main.rs"

[dependencies]
spacetimedb-sdk = "=2.3.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The pure resolution core — priority, read-rule, action composition. Shared with any
# other consumer so the worker resolves identically to the spec. Host-relative path
# (server/worker/ → repo/shared): this crate has no build compose, so it resolves on
# the host tree (unlike the edge, which builds in-container against a bind-mount).
resonantdust-tick = { path = "../../shared/tick" }
