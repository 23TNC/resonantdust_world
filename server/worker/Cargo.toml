[package]
name = "worker"
version = "0.1.0"
edition = "2021"

# worker — the resolver. An SDK client that composes each assigned conflict-component in local scratch
# (from < tic bases, in event_reference order) and writes absolute finals. Owns no tables; subscribes
# to its own event_log + state_log rows, calls data_shard.write + event_shard.complete.

[[bin]]
name = "worker"
path = "src/main.rs"

[dependencies]
spacetimedb-sdk = "=2.3.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
resonantdust-st-bindings = { path = "../st-bindings" }
resonantdust-codec = { path = "../../shared/codec" }
resonantdust-dsl = { path = "../../shared/dsl" }
resonantdust-uplink = { path = "../uplink" }
