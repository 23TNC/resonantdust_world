[package]
name = "edge"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "edge"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync"] }
axum = { version = "0.8", features = ["ws"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
# Client<->server protocol framing (JSON over WS for now; a binary codec in a
# shared crate can replace it later — see protocol.rs).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Upstream client to the SpacetimeDB modules (index / players). Pinned
# EXACTLY to the cli that generated src/bindings/ (spacetime 2.3.0): a caret
# "2.3" resolves to the latest 2.x (2.6.0), whose `spacetimedb-lib` build script
# panics in the toolchain-free build image — and a newer SDK can drift from the
# 2.3.0-generated bindings besides.
spacetimedb-sdk = "=2.3.0"
# The shared bit-packing codec: the one definition of the `zone_id → region_id`
# mask (and the wider wire layouts), shared with the SpacetimeDB `index` module
# and the client. Reached via the `../../shared:/shared` bind-mount in compose.yml;
# the path is container-relative (`/workspace/../shared` = `/shared`) — the edge
# only ever builds in-container, so the host depth (server/edge/) doesn't matter.
resonantdust-codec = { path = "../shared/codec" }
# The DSL — worldgen loads the content tree through this to map tile names
# ("grass"/"dirt") to the packed `def_id`s it writes into a zone's terrain. The
# `:data` side the server reads; the client reads the `:visual` side of the same
# corpus via the wasm bundle, so a `def_id` means the same tile on both ends.
resonantdust-content = { path = "../shared/content" }
# CORS for the asset routes: the browser client fetches `/content` + `/textures`
# cross-origin, so the responses need `Access-Control-Allow-Origin` (+ ETag
# exposed for the texture cache's revalidation). Same version as the gateway.
tower-http = { version = "0.6", features = ["cors"] }
# Content + texture serving from R2 (CONTENT_SOURCE / TEXTURE_SOURCE = r2): reqwest
# GETs assets over short-lived SigV4-presigned URLs rusty-s3 builds (R2 is
# S3-compatible), reusing the native-tls/openssl the SDK already links. Disk mode
# uses neither. `url` is rusty-s3's endpoint type.
reqwest = "0.12"
rusty-s3 = "0.5"
url = "2"
# On-demand texture derivation: downscale a master albedo into the requested
# lower resolution (the half-res preview) instead of pre-baking. PNG-only, lean.
image = { version = "0.25", default-features = false, features = ["png"] }
