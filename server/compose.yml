networks:
  resonantdust:
    external: true

services:
  # Compile the server release binary on the local daemon. One binary serves
  # every env (it reads SERVER_LISTEN at runtime). Output lands at
  # /workspace/target/release/server, visible on the host via the bind mount.
  #
  # Built from ./Dockerfile (rust:slim + pkg-config + libssl-dev): the
  # SpacetimeDB SDK's native-tls/openssl-sys needs the OpenSSL headers, which
  # stock rust:slim lacks. `rd build server` passes `--build` so this image is
  # (re)built as needed.
  build:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/workspace
      # The server path-deps resonantdust-codec at ../shared/codec. Mounting the
      # shared workspace as a sibling of /workspace makes that relative path
      # resolve in-container (/workspace/../shared/codec = /shared/codec), the
      # same place the path points on the host.
      - ../shared:/shared
    working_dir: /workspace
    # spacetimedb-lib's build script shells out to `git rev-parse HEAD` to stamp
    # a commit hash, panicking when git is absent (it is, in rust:slim). This env
    # var (its Nix escape hatch) supplies the hash directly and skips the git
    # call — the spacetime cli 2.3.0 commit that generated src/bindings/.
    environment:
      SPACETIMEDB_NIX_BUILD_GIT_COMMIT: "aa73d1c35b4b346b98eeba10a3d756b4ae72162f"
    command: ["cargo", "build", "--release"]

  # Long-lived server containers — one per local env, side by side. Each idles
  # (`sleep infinity`) so `rd redeploy` can run/re-run the compiled binary inside
  # it (mirroring how spacetime publishes into its always-on container). The
  # binary at /workspace/target/release/server is shared via the bind mount; the
  # env's port/log are passed at exec time.
  server:
    image: rust:slim
    networks: [resonantdust]
    ports: ["8473:8473"]
    volumes:
      - .:/workspace
      # The DSL content tree lives at the repo root, a sibling of the server dir
      # this service mounts as /workspace. Nest it at /workspace/content so the
      # binary's default RD_CONTENT_DIR ("content", relative to its /workspace
      # cwd) finds it — worldgen reads it to seed zones. Read-only: the server
      # never writes content.
      - ../content:/workspace/content:ro
      # The texture master tree, likewise nested at /workspace/textures so the
      # binary's default TEXTURE_DIR ("textures") finds it — the server serves
      # /textures from it (disk mode). Read-only: masters are authored by bin/art,
      # never written by the server (derived previews cache under the temp dir).
      - ../textures:/workspace/textures:ro
    working_dir: /workspace
    command: ["sleep", "infinity"]

  server-claude:
    image: rust:slim
    networks: [resonantdust]
    ports: ["8474:8474"]
    volumes:
      - .:/workspace
      # The DSL content tree lives at the repo root, a sibling of the server dir
      # this service mounts as /workspace. Nest it at /workspace/content so the
      # binary's default RD_CONTENT_DIR ("content", relative to its /workspace
      # cwd) finds it — worldgen reads it to seed zones. Read-only: the server
      # never writes content.
      - ../content:/workspace/content:ro
      # The texture master tree, likewise nested at /workspace/textures so the
      # binary's default TEXTURE_DIR ("textures") finds it — the server serves
      # /textures from it (disk mode). Read-only: masters are authored by bin/art,
      # never written by the server (derived previews cache under the temp dir).
      - ../textures:/workspace/textures:ro
    working_dir: /workspace
    command: ["sleep", "infinity"]

  server-test:
    image: rust:slim
    networks: [resonantdust]
    ports: ["8475:8475"]
    volumes:
      - .:/workspace
      # The DSL content tree lives at the repo root, a sibling of the server dir
      # this service mounts as /workspace. Nest it at /workspace/content so the
      # binary's default RD_CONTENT_DIR ("content", relative to its /workspace
      # cwd) finds it — worldgen reads it to seed zones. Read-only: the server
      # never writes content.
      - ../content:/workspace/content:ro
      # The texture master tree, likewise nested at /workspace/textures so the
      # binary's default TEXTURE_DIR ("textures") finds it — the server serves
      # /textures from it (disk mode). Read-only: masters are authored by bin/art,
      # never written by the server (derived previews cache under the temp dir).
      - ../textures:/workspace/textures:ro
    working_dir: /workspace
    command: ["sleep", "infinity"]
