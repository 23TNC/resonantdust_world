[package]
name = "gateway"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "gateway"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }
axum = "0.8"
# CORS for the directory API: the browser client (pixijs dev server / deployed
# site) is a different origin than the gateway, so `GET /server` is a cross-origin
# fetch — without `Access-Control-Allow-Origin` the browser blocks the reply and
# `fetch` rejects with "Failed to fetch". 0.6 pairs with axum 0.8's tower stack.
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Request/response framing for the directory API (JSON over HTTP).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Upstream client to the SpacetimeDB `index` DB — the gateway subscribes to the
# `servers` / `player_servers` directory and calls its allocation reducers.
# Pinned EXACTLY to the cli that generated src/bindings/ (spacetime 2.3.0): a
# caret "2.3" resolves to the latest 2.x (2.6.0), whose `spacetimedb-lib` build
# script panics in the toolchain-free build image — and a newer SDK can drift
# from the 2.3.0-generated bindings besides. (Same pin as server/Cargo.toml.)
spacetimedb-sdk = "=2.3.0"
