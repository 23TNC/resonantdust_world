[package]
name = "resonantdust-content"
version = "0.1.0"
edition = "2021"
publish = false
description = "Resonant Dust (world) content — the TOML corpus loader that turns content/**/*.toml into a materialized Bundle (registries, flat tables, the biome rule classifier, needs/conditions/interactions). Pure Rust, no wasm: the server links this directly as an rlib; the client reaches it through the resonantdust-shared wasm bundle."

[lib]
name = "resonantdust_content"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
resonantdust-codec = { path = "../codec" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
