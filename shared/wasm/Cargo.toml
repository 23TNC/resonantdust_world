[package]
name = "resonantdust-shared"
version = "0.1.0"
edition = "2021"
publish = false
description = "Resonant Dust (world) client-side wasm crate — the shared Rust logic compiled to a browser bundle the pixijs client imports. The server does NOT consume this; it links the shared logic crates (resonantdust-core, …) directly as rlibs. This crate just re-exports the pieces and wraps them for the browser."

[lib]
name = "resonantdust_shared"
path = "src/lib.rs"
# cdylib → the wasm bundle for pixijs; rlib → native linking + `cargo test`.
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Enable the wasm-bindgen-annotated public API for browser consumption. Off by
# default so `cargo check` / `test` exercise the plain logic natively, without
# the wasm toolchain. Pulls in `client` (the session core + web transport) and
# `js-sys` (event marshaling), both browser-only — gating them here keeps the
# native `cargo check --workspace` off the wasm-only deps.
js = ["dep:wasm-bindgen", "dep:js-sys", "dep:client"]

[dependencies]
resonantdust-core = { path = "../core" }
resonantdust-codec = { path = "../codec" }
# The DSL — the client reaches the `:visual` side here (def_id → tile colour) to
# paint zones. Loaded from fetched `.rd` strings at runtime, the same corpus the
# server loads from disk: one content set, identical ids on both sides.
resonantdust-dsl = { path = "../dsl" }
# The headless client core in its browser (`web`) skin — login + the
# anchor-driven zone subscription engine. The `WorldClient` surface wraps it;
# `default-features = false` drops the native (tokio) transport.
client = { path = "../../client/core", default-features = false, features = [
    "web",
], optional = true }
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
