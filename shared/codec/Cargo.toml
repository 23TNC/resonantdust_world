[package]
name = "resonantdust-codec"
version = "0.1.0"
edition = "2021"
publish = false
description = "Resonant Dust (world) codec — the bit-packing layer shared by every consumer: `valid_at` bitemporal PKs, zone geometry, packed things/tiles, and `zone_id` ↔ `region_id` composition. Pure integer math, no wasm: the spacetime modules and the native server link it as an rlib (via the shared bind-mount); the client reaches the same code through the resonantdust-shared wasm bundle. This is the one place the wire bit-layouts are defined, so the two sides can never drift."

[lib]
name = "resonantdust_codec"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
