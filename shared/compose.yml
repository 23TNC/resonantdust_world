services:
  # The type-check gate. TWO passes, and both are load-bearing:
  #
  #   1. native `--workspace --all-targets` — the plain logic + every test target.
  #   2. wasm32 `-p resonantdust-shared --features js` — the browser surface.
  #
  # Pass 2 exists because `js` is **off by default** (deliberately: it pulls `client` + `js-sys`,
  # which are browser-only, and keeping them out of pass 1 is what lets the native check run
  # without the wasm toolchain — see shared/wasm/Cargo.toml). The consequence is that pass 1
  # compiles **none** of the `#[wasm_bindgen]` API, so on its own it returns green while the code
  # the browser actually loads is broken. That was real: `rd build shared` caught three broken
  # call sites a green `check` had missed (logged as deviation D-7). A gate that doesn't gate is
  # worse than no gate, so `check` now runs both. Costs ~20s on the first wasm pass; incremental
  # after. `sh -c` because two cargo invocations need a shell.
  check:
    image: clockworklabs/spacetime:latest
    volumes:
      - ..:/workspace
    working_dir: /workspace/shared
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        echo '── check 1/2: native (workspace, all targets)'
        cargo check --workspace --all-targets
        echo '── check 2/2: wasm32 (the js-gated browser surface)'
        cargo check -p resonantdust-shared --features js --target wasm32-unknown-unknown --lib

  # Native-only check — the inner-loop escape hatch when you are NOT touching the wasm surface
  # and want the fast pass. Prefer `check`; this one is blind to the browser API by construction.
  check-native:
    image: clockworklabs/spacetime:latest
    volumes:
      - ..:/workspace
    working_dir: /workspace/shared
    entrypoint: ["cargo"]
    command: ["check", "--workspace", "--all-targets"]

  test:
    image: clockworklabs/spacetime:latest
    volumes:
      - ..:/workspace
    working_dir: /workspace/shared
    entrypoint: ["cargo"]
    command: ["test", "--workspace"]

  build:
    image: clockworklabs/spacetime:latest
    volumes:
      - ..:/workspace
    working_dir: /workspace/shared
    entrypoint: ["cargo"]
    command: ["build", "--workspace", "--release"]

  # Builds the JS/wasm bundle the webgl client imports.
  #
  # We bypass wasm-pack and call `cargo build` + `wasm-bindgen` directly —
  # wasm-pack 0.14 still passes `cargo build --out-dir`, which cargo 1.92+
  # renamed to the unstable `--artifact-dir`, breaking on stable.
  #
  # wasm-bindgen-cli isn't in the spacetime image; first run installs it under
  # target/wasm-tools (gitignored, persists via the host mount). The CLI version
  # must match the wasm-bindgen version in Cargo.lock.
  wasm:
    image: clockworklabs/spacetime:latest
    volumes:
      - ..:/workspace
    working_dir: /workspace/shared
    environment:
      PATH: /workspace/shared/target/wasm-tools/bin:/usr/local/cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      WASM_BINDGEN_VERSION: "0.2.122"
    entrypoint: ["bash", "-euo", "pipefail", "-c"]
    command:
      - |
        if ! command -v wasm-bindgen >/dev/null 2>&1; then
          cargo install wasm-bindgen-cli \
            --version "$$WASM_BINDGEN_VERSION" \
            --root /workspace/shared/target/wasm-tools \
            --locked
        fi
        cargo build -p resonantdust-shared --target wasm32-unknown-unknown --features js --release
        wasm-bindgen \
          target/wasm32-unknown-unknown/release/resonantdust_shared.wasm \
          --target web \
          --out-dir pkg
