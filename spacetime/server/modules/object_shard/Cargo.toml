[package]
name = "resonantdust_object_shard"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib"]

[dependencies]
spacetimedb = { version = "=2.1.0" }
log = "0.4"
# The shared bit-packing layer: `valid_at` PKs, zone geometry, the sub-tile
# `offset` helpers. Reached via the `../shared:/workspace/shared` bind-mount in
# ../../../compose.yml — the path is container-relative. The client links the
# same crate through the wasm bundle, so the two sides can't drift. Mirrors the
# zone_shard's dependency (they share the codec so free ⇄ affixed layouts agree).
resonantdust-codec = { path = "../../../shared/codec" }
