[package]
name = "resonantdust_players"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib"]

[dependencies]
spacetimedb = { version = "=2.1.0" }
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# The auth DB needs only the `valid_at` bit-helpers; they live in the shared
# codec with every other wire layout. Reached via the
# `../shared:/workspace/shared` bind-mount in ../../../compose.yml (the path is
# container-relative). The codec is back — re-linked here when `zone_id`
# composition made sharing the bit-layouts worthwhile again.
resonantdust-codec = { path = "../../../shared/codec" }
